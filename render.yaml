# Render blueprint for the API. Secrets are marked sync: false, so Render asks for them at setup and
# they are never stored in this file. The frontend deploys separately, on Vercel.
services:
  - type: web
    name: farmagent-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
