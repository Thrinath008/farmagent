[project]
name = "farmagent-backend"
version = "1.0.0"
description = "FarmAgent — intelligent personal farming assistant API"
requires-python = ">=3.12"
# Kept in step with requirements.txt, which local setup and CI install from; Vercel installs from here.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings>=2.6,<3",
    "httpx==0.28.1",
    "anthropic==2.4.0",
    "sqlalchemy[asyncio]==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]  # the formatter governs line length; prose strings may run over

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]
